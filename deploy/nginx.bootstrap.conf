# nginx — arranque sin TLS de __DOMAIN__
#
# Solo se usa durante la instalación, mientras no existe el certificado: sirve
# el sitio por HTTP para comprobar que el dominio llega al servidor. NO publica
# la API: la clave de edición no debe viajar nunca sin cifrar.
# deploy/setup-server.sh lo sustituye por nginx.conf en cuanto hay certificado.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __ROOT__;
    index index.html;

    access_log /var/log/nginx/bitacora.access.log;
    error_log /var/log/nginx/bitacora.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

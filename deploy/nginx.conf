# nginx — Bitácora de TFG en __DOMAIN__
#
# Sitio estático de Vite en __ROOT__ y, si se instala, la API en
# http://127.0.0.1:__PORT__ publicada bajo /api/.
# Lo instala deploy/setup-server.sh, que sustituye los marcadores __X__ y
# quita el bloque de la API cuando DEPLOY_API=0.
#
# HTTP/2: no se declara aquí a propósito. En nginx anterior a 1.25 `http2` es
# una opción del socket :443, compartida por todos los sitios del servidor:
# si otro sitio ya la declara, vale también para este, y declararla dos veces
# da "duplicate listen options" y tumba toda la configuración. En nginx 1.25.1
# o posterior añade `http2 on;` dentro del server.

# API-BEGIN
# Tope de peticiones por IP a la API. La zona se define a nivel http, que es
# donde nginx incluye este fichero.
limit_req_zone $binary_remote_addr zone=bitacora_api:1m rate=10r/s;
# API-END

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root __ROOT__;
    index index.html;

    access_log /var/log/nginx/bitacora.access.log;
    error_log /var/log/nginx/bitacora.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Cabeceras de seguridad.
    # OJO: en nginx, un `location` que declara su propio `add_header` DESCARTA
    # todos los heredados. Por eso se repiten en los bloques de abajo; si
    # añades una cabecera aquí, replícala allí.
    #
    # La CSP solo deja cargar código de este mismo origen. La página guarda la
    # clave de edición en el navegador, así que un script inyectado podría
    # robarla: esta cabecera es la segunda barrera, después de que la interfaz
    # nunca inserte como HTML lo que escribe el usuario.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Ficheros con hash en el nombre (Vite) → caché de un año.
    location ^~ /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API-BEGIN
    location /api/ {
        limit_req zone=bitacora_api burst=30 nodelay;
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    # API-END

    # La página no se cachea: así un despliegue nuevo se ve al recargar.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
